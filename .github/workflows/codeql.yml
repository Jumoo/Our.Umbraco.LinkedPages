name: CodeQL

# Weekly only, not on every push and PR (Jumoo/jumoo-context#159). A week's delay on a finding
# costs little. Scheduled runs scan the default branch only; run it by hand on another branch.
# Don't turn on GitHub's "default setup" for CodeQL: it scans every push and PR.
on:
  schedule:
    # weekly, so advisories published after a change still get picked up
    - cron: "33 8 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode none: CodeQL scans the source without compiling it, so this
          # doesn't need the sdk, node, a restore, or the locked-mode dance.
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: none
          # the backoffice client is TypeScript, and it is where most of the package's
          # user facing behaviour lives - worth scanning too.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
