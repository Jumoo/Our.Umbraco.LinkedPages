name: PR Project Build

permissions:
  contents: read

# NOTE: this repo releases from "v18/main" - a branch per Umbraco major, matching the
# rest of Jumoo. Plain "main" is kept in the filter so a re-created main, or a branch
# that hasn't been moved over yet, still builds.
on:
  pull_request:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  config: Release
  # NOTE: not the solution - *.slnx is gitignored and src/LinkedPages.Site (a local test
  # site) isn't in the repo either. The package project is the whole of what ships.
  package_project: ./src/Umbraco.Community.LinkedPages/Umbraco.Community.LinkedPages.csproj
  client_folder: ./src/Umbraco.Community.LinkedPages/Client

jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: install client dependencies
        run: npm ci
        working-directory: ${{ env.client_folder }}

      # runs tsc then vite - this is what produces wwwroot, which is gitignored, so it
      # has to happen before the dotnet build picks up static assets.
      - name: build client
        run: npm run build
        working-directory: ${{ env.client_folder }}

      - name: restore
        run: dotnet restore ${{ env.package_project }} --locked-mode

      - name: build
        run: >
          dotnet build ${{ env.package_project }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true
